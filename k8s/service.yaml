apiVersion: v1
kind: Service
metadata:
  name: demo-workshop-service
  namespace: demo-workshop
spec:
  selector:
    app: demo-workshop
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      # ↑ Changed from 8080 to 8000
      # Spring Boot app runs on 8000 as shown in logs:
      # "Tomcat initialized with port(s): 8000 (http)"
  type: LoadBalancer
